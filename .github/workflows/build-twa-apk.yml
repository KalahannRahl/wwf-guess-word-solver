name: Build TWA APK for Google Play

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code — increment by 1 each release'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          JDK_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JDK_HOME" \
            "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" \
            > ~/.bubblewrap/config.json
          echo "Bubblewrap config:"
          cat ~/.bubblewrap/config.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > twa/keystore.jks
          echo "Keystore decoded ($(stat -c%s twa/keystore.jks) bytes)"

      - name: Patch version in twa-manifest.json
        run: |
          cd twa
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.appVersion = '${{ github.event.inputs.version_name }}';
            m.appVersionCode = parseInt('${{ github.event.inputs.version_code }}');
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Version set to', m.appVersion, '/', m.appVersionCode);
          "

      - name: Build signed APK + AAB
        run: |
          cd twa
          # Pipe keystore password twice (keystore pw + key pw — both are the same)
          printf '%s\n%s\n' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            | bubblewrap build --skipPwaValidation 2>&1

      - name: Locate build outputs
        run: |
          echo "=== APK/AAB files ==="
          find twa -name "*.apk" -o -name "*.aab" 2>/dev/null | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuessWordSolver-v${{ github.event.inputs.version_name }}-${{ github.run_number }}
          path: |
            twa/app-release-signed.apk
            twa/app/build/outputs/apk/release/*.apk
            twa/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
