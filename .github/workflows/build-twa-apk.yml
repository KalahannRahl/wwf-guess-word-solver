name: Build TWA APK for Google Play

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code — increment by 1 each release'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Set up Android SDK components
        run: |
          # Determine SDK root — runners expose ANDROID_SDK_ROOT or ANDROID_HOME
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK"
          echo "Build-tools present:"
          ls "$SDK/build-tools/" 2>/dev/null || echo "  (none found yet)"
          # Accept licenses and ensure build-tools 34 + platform 34 are installed
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" \
            "platforms;android-34" 2>&1 | tail -5
          echo "Build-tools after install:"
          ls "$SDK/build-tools/"

      - name: Configure Bubblewrap
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          JDK_HOME="$JAVA_HOME"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JDK_HOME" "$SDK" \
            > ~/.bubblewrap/config.json
          echo "Bubblewrap config:"
          cat ~/.bubblewrap/config.json
          echo "Running doctor check:"
          bubblewrap doctor 2>&1 || true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Use env var (not inline secret) so shell metacharacters are safe.
          # tr -d '\r' strips Windows CRLF that can sneak in via copy-paste.
          printf '%s' "$KEYSTORE_B64" | tr -d '\r' | base64 --decode > twa/keystore.jks
          BYTES=$(stat -c%s twa/keystore.jks)
          echo "Keystore decoded: $BYTES bytes"
          if [ "$BYTES" -lt 100 ]; then
            echo "ERROR: keystore too small — KEYSTORE_BASE64 secret may not be set"
            exit 1
          fi

      - name: Patch version in twa-manifest.json
        run: |
          cd twa
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.appVersion = '${{ github.event.inputs.version_name }}';
            m.appVersionCode = parseInt('${{ github.event.inputs.version_code }}');
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Version set to', m.appVersion, '/', m.appVersionCode);
          "

      - name: Build signed APK + AAB
        run: |
          cd twa
          # Bubblewrap prompts for keystore password then key password (same value)
          printf '%s\n%s\n' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            | bubblewrap build --skipPwaValidation 2>&1

      - name: Locate build outputs
        if: always()
        run: |
          echo "=== APK/AAB files ==="
          find twa -name "*.apk" -o -name "*.aab" 2>/dev/null | sort

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: GuessWordSolver-v${{ github.event.inputs.version_name }}-${{ github.run_number }}
          path: |
            twa/app-release-signed.apk
            twa/app/build/outputs/apk/release/*.apk
            twa/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
