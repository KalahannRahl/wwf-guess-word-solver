name: Build TWA APK for Google Play

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code — increment by 1 each release'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses and install platform 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" 2>&1 | tail -3
          echo "Android SDK: $SDK"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r' | base64 --decode > twa/keystore.jks
          BYTES=$(stat -c%s twa/keystore.jks)
          echo "Keystore decoded: $BYTES bytes"
          if [ "$BYTES" -lt 100 ]; then
            echo "ERROR: keystore too small — KEYSTORE_BASE64 secret may not be set"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build signed APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cd twa/android
          echo "sdk.dir=$SDK" > local.properties
          gradle assembleRelease bundleRelease \
            -PversionCode=${{ github.event.inputs.version_code }} \
            -PversionName=${{ github.event.inputs.version_name }}

      - name: Locate build outputs
        if: always()
        run: |
          echo "=== APK/AAB files ==="
          find twa -name "*.apk" -o -name "*.aab" 2>/dev/null | sort

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: GuessWordSolver-v${{ github.event.inputs.version_name }}-${{ github.run_number }}
          path: |
            twa/android/app/build/outputs/apk/release/*.apk
            twa/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
